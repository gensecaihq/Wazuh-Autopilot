# LiteLLM proxy config (docker compose --profile litellm). Point Autopilot at it:
#   Settings → Models → LiteLLM, base URL http://litellm:4000, model "soc-default"
model_list:
  - model_name: soc-default
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-5
      aws_region_name: os.environ/AWS_REGION
  - model_name: soc-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
