# =============================================================================
# Wazuh Autopilot - CI
# - backend: pytest (platform, policy, skills accuracy against the Wazuh ruleset)
# - ui: type-check and production build
# - mock-wazuh: smoke test
# - docker: build images and scan with Trivy
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: backend
        run: pytest -q

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm run build
      - name: Audit
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

  mock-wazuh:
    name: Mock Wazuh MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mock-wazuh/requirements.txt
      - name: Start and probe
        run: |
          cd mock-wazuh && (MOCK_PORT=3900 python -m mock_wazuh &) && cd ..
          for i in $(seq 1 30); do curl -sf localhost:3900/health && break; sleep 1; done
          curl -sf -X POST localhost:3900/auth/token -H 'content-type: application/json' -d '{"api_key":"wazuh_demo_key"}' | grep -q access_token

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wazuh-autopilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build mock-wazuh image
        run: docker build -t wazuh-autopilot-mock-wazuh:${{ github.sha }} mock-wazuh
      - name: Scan platform image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: wazuh-autopilot:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
